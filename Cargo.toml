[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jffjs-hermes/tessera"
# M7 Card E (B1 resolved): egui 0.37 / egui-wgpu 0.37 / egui-winit 0.37 all
# declare rust_version = "1.95" (spec §4.2). The stable toolchain is well past
# 1.95, so this is not a practical constraint.
rust-version = "1.95"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
