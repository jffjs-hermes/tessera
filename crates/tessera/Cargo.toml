[package]
name = "tessera"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Windowed developer tooling (debug console panel + inspector hook). Non-default
# so release / dist builds and the headless path never compile egui (spec §4.3).
# egui 0.37 ships `default = []` (no bundled fonts), so `default_fonts` is
# required for any text to render (spec §4.1: "verify exact feature list at
# implementation").
devtools = ["dep:egui", "dep:egui-winit", "dep:egui-wgpu"]

[dependencies]
anyhow = "1.0.104"
hecs = "0.11"
mlua = { version = "0.12.2", features = ["luau", "send"] }
notify = "8.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tessera-core = { path = "../tessera-core" }
tessera-mods = { path = "../tessera-mods" }
tessera-script = { path = "../tessera-script" }
tessera-render = { path = "../tessera-render" }
winit = "0.30.13"

# M7 Card E — egui devtools. Optional, gated behind the `devtools` feature so a
# default build has zero egui in the dependency graph (CI asserts this).
# egui-wgpu 0.37 pairs with wgpu ^30 / winit ^0.30.13 (first-class match, no
# pinning); egui-winit 0.37 with `clipboard` (arboard + wayland dlopen, no
# system-wayland build dep). No eframe: we wire egui directly onto the existing
# winit/wgpu objects (spec §4.1).
egui = { version = "0.37", optional = true, default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.37", optional = true, default-features = false, features = ["clipboard"] }
egui-wgpu = { version = "0.37", optional = true, default-features = false, features = ["winit"] }

[dev-dependencies]
zip = { version = "6", default-features = false, features = ["deflate"] }
