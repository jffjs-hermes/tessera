# Base blueprints: data-driven entity definitions for M2.
#
# Top-level table name = blueprint id. `inherits` is a single parent (whole-part
# inheritance, deterministic parent→child). `parts.<Name>` payloads are typed by
# the engine's part registry (unknown part names are a load error; the reserved
# `handlers` table is rejected until M3). See docs/specs/m2-entities.md §2.

[Actor]
# Abstract root of the creature chain. M3 base data adds the Health part for
# the minimal-combat reserve; creatures inherit it.
parts.Health = { hp = 20 }
# Every creature carries attributes and a level: the abstract root owns the
# defaults, blueprints override per creature/class. Attribute values are
# load-time invariants in [1, 30], level in [1, 20].
parts.Attributes = { might = 14, agility = 9, toughness = 13, will = 8, intellect = 11 }
parts.Level = { level = 1 }

[Humanoid]
inherits = "Actor"
parts.Render = { tile = "creature.humanoid" }
parts.ActorEnergy = { speed = 100 }

[Player]
inherits = "Humanoid"
parts.Render = { tile = "creature.player" }
scripts = ["scripts/player_respawn.luau"]

[Goblin]
inherits = "Humanoid"
parts.Render = { tile = "creature.goblin" }
parts.GoblinBrain = { detect = 10 }
parts.Health = { hp = 3 }
# The S1 goblin fixture (s1-stats §4.6, from prototype_class_sim.py's ENEMY
# table: L2, M9/A13/T9/W6/I7, ac 2): its own attributes/level override the
# Actor root, and `Bonuses.ac` stands in for the not-yet-existing leather
# armor (S2 gear). Derived: HP 34, Acc 8, Dodge 8, Def 12, Spd 106 — the
# demo's goblin speed visibly reflects Agility (13 -> 106), not a flat 100.
parts.Attributes = { might = 9, agility = 13, toughness = 9, will = 6, intellect = 7 }
parts.Level = { level = 2 }
parts.Bonuses = { ac = 2 }
scripts = ["scripts/goblin_ai.luau"]
