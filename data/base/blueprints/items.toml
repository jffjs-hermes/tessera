# Base item blueprints: the melee slice's gear, authored as data.
#
# Item blueprints are plain content: `parts.Item` is the identity/weight part
# (kind schema), and the optional `parts.Weapon`/`parts.Armor` payloads are
# native typed parts validated at load time (unknown fields, bad ranges and an
# unknown `stat`/`slot` all fail closed). Nothing here contains a formula: the
# rules script owns every tunable term, and the engine only sums what is worn.
#
# Slots are the fixed equipment vocabulary: main_hand, off_hand, head, body,
# arms, legs (boots are part of legs, per Items and Gear).
#
# The mail set is the Knight kit the design tables name. Its totals are the
# calibration the stat formulas are pinned against: AC 12 (2 shield + 4
# hauberk + 2 half-helm + 2 sleeves + 2 boots) and 33 worn weight against a
# Might-14 threshold of 28 (+5% armor-load penalty on the speed base).

[Item_Longsword]
parts.Item = { name = "Longsword", slot = "main_hand", weight = 3, tier = "common", price = 40 }
parts.Weapon = { lo = 4, hi = 8, stat = "might", hands = 1, reach = 1, cost = 100, accuracy_bonus = 0 }

[Item_Greatsword]
parts.Item = { name = "Greatsword", slot = "main_hand", weight = 8, tier = "fine", price = 90 }
parts.Weapon = { lo = 7, hi = 12, stat = "might", hands = 2, reach = 1, cost = 130, accuracy_bonus = -1 }

[Item_RoundShield]
parts.Item = { name = "Round shield", slot = "off_hand", weight = 6, tier = "common", price = 25 }
parts.Armor = { ac = 2, block = 15, resist = { slash = 0, pierce = 0, blunt = 0 }, threshold = {} }

