# Doorway batch scenario: three raiders behind a one-tile choke point.
#
# The band is the approved phase-1 design target for the doorway case: the
# expert Knight line holds the choke and wins at least 90 runs in 100.
[scenario]
id = "doorway_3_goblins"
map = "sim_doorway"
turn_cap = 30000
player_spawn = [3, 7]
start_alertness = "alerted"

[[enemies]]
blueprint = "GoblinRaider"
spawn_cells = [[18, 6], [18, 7], [18, 8]]

[band]
expert = [90, 100]
