# Open batch scenario: the same three raiders in a clear room, no choke point.
#
# The approved phase-1 band for the open case is wide on purpose: three
# attackers landing freely is the pressure the doorway denies them.
[scenario]
id = "open_3_goblins"
map = "sim_open"
turn_cap = 30000
player_spawn = [3, 7]
start_alertness = "alerted"

[[enemies]]
blueprint = "GoblinRaider"
spawn_cells = [[18, 6], [18, 7], [18, 8]]

[band]
expert = [55, 85]
